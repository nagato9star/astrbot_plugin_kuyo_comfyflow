<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuyo ComfyFlow · 工作流与配方</title>
<link rel="stylesheet" href="./graph-editor.bundle.css?v=comfy-1" />
<link rel="stylesheet" href="./style.css?v=comfy-1" />
</head>
<body>
  <header id="topbar">
    <div class="brand">Kuyo ComfyFlow</div>
    <div class="spacer"></div>
    <span id="conn-dot" class="dot wait"></span>
    <span id="conn-text">检测中…</span>
    <span id="gpu-text" class="dim"></span>
    <button id="btn-refresh" type="button">刷新连接</button>
  </header>

  <main id="layout">
    <aside class="rail" id="rail-left">
      <section>
        <div class="sec-head">
          <h2>工作流图</h2>
          <div class="sec-actions">
            <label class="file-btn">导入<input id="file-import" type="file" accept=".json,application/json" /></label>
            <button id="btn-from-comfy" type="button" title="导入 ComfyUI 最近一次生成的工作流">刚画过的</button>
          </div>
        </div>
        <ul id="wf-list" class="pick-list"></ul>
      </section>
      <section>
        <div class="sec-head">
          <h2>静态配方</h2>
          <button id="btn-new-recipe" type="button">新建一套</button>
        </div>
        <ul id="recipe-list" class="pick-list"></ul>
      </section>
    </aside>

    <section id="editor">
      <div class="editor-tabs" role="tablist" aria-label="工作台区域">
        <button id="tab-workflow" type="button" role="tab" aria-controls="workflow-pane" aria-selected="true">工作流</button>
        <button id="tab-recipe" type="button" role="tab" aria-controls="recipe-pane" aria-selected="false">静态配方</button>
      </div>

      <div id="workflow-pane" role="tabpanel" aria-labelledby="tab-workflow">
        <div class="workflow-card">
          <div class="workflow-title"><span>当前工作流</span><strong id="workflow-active-name">尚未选择</strong><span id="workflow-active-source" class="workflow-source"></span></div>
          <div class="workflow-routing">
            <label class="field"><span>用途</span><select id="workflow-purpose"><option value="generate">生图</option><option value="edit">编辑图</option></select></label>
            <label class="field grow" id="workflow-family-wrap"><span>生图家族</span><select id="workflow-family"></select></label>
            <label class="field grow" id="workflow-edit-route-wrap" hidden><span>编辑路由名</span><input id="workflow-edit-route" list="workflow-edit-route-options" placeholder="如 qwen-edit" /><datalist id="workflow-edit-route-options"></datalist></label>
            <label class="field grow" id="workflow-edit-description-wrap" hidden><span>用途说明</span><input id="workflow-edit-description" placeholder="例如：Qwen 图片转真人风格" /></label>
            <button id="btn-bind-workflow" class="primary" type="button">绑定当前工作流</button>
            <button id="btn-unbind-edit" type="button" hidden>解除编辑绑定</button>
          </div>
          <p id="workflow-bind-status" class="hint"></p>
        </div>

        <section id="graph-editor-panel" class="graph-editor-panel">
          <div class="graph-toolbar">
            <button id="graph-toggle-palette" type="button" aria-expanded="true" aria-controls="graph-palette">节点库</button>
            <button id="graph-toggle-inspector" type="button" aria-expanded="true" aria-controls="graph-inspector">参数面板</button>
            <label class="field graph-name-field"><span>工作流名称</span><input id="graph-name" maxlength="64" placeholder="workflow_name" /></label>
            <button id="graph-save" class="primary" type="button">保存工作流</button>
            <button id="graph-run" type="button">运行当前画布</button>
            <button id="graph-fit" type="button" title="适配画布">适配</button>
            <button id="graph-undo" type="button" disabled>撤销</button>
            <button id="graph-redo" type="button" disabled>重做</button>
            <button id="graph-expand" type="button">放大画布</button>
            <button id="graph-stop" type="button">中断</button><button id="graph-resume" type="button" hidden>继续等待</button>
            <label class="file-btn">导入 JSON<input id="graph-import" type="file" accept=".json,application/json" /></label>
          </div>
          <div class="graph-inline-layout">
            <aside id="graph-palette" class="graph-palette">
              <h3>节点库</h3>
              <input id="graph-search" type="search" placeholder="搜索节点名称或类别" />
              <div id="graph-palette-list" class="graph-palette-list"></div>
            </aside>
            <div class="graph-stage">
              <div class="graph-canvas-frame"><canvas id="workflow-canvas" tabindex="0"></canvas></div>
              <div class="graph-footer"><span id="graph-status">等待工作流</span><span id="graph-run-status"></span></div>
              <div class="graph-run-result"><div id="graph-preview" class="preview empty"></div></div>
            </div>
            <aside id="graph-inspector" class="graph-inspector">
              <h3>节点参数</h3>
              <div id="graph-inspector-content" class="graph-inspector-content">点击节点查看参数。</div>
            </aside>
          </div>
        </section>

        <div class="sec-head"><h3>节点映射</h3><div class="sec-actions"><button id="btn-detect-slots" type="button">重新识别</button><button id="btn-save-profile" type="button">保存映射</button></div></div>
        <div id="slot-grid" class="slot-grid"></div>
        <details id="slot-extra" class="extra"><summary>更多节点（来源图片 / 画师 / 负向 / 触发词）</summary><div id="slot-grid-extra" class="slot-grid"></div></details>

        <details id="workflow-json-editor" class="workflow-json-editor">
          <summary>编辑工作流 API JSON</summary>
          <textarea id="workflow-json" spellcheck="false" aria-label="工作流 API JSON"></textarea>
          <div class="row-actions"><button id="btn-save-workflow-json" type="button">保存工作流 JSON</button></div>
        </details>
      </div>

      <div id="recipe-pane" role="tabpanel" aria-labelledby="tab-recipe" hidden>
        <div class="editor-head">
          <label class="field grow"><span>配方名称</span><input id="recipe-name" placeholder="立绘、日常、横版场景…" /></label>
          <label class="field grow"><span>用途说明</span><input id="recipe-desc" placeholder="画角色全身或半身时用" /></label>
          <button id="btn-save" class="primary" type="button">保存配方</button>
          <button id="btn-delete-recipe" class="danger" type="button">删除</button>
        </div>
        <label class="field"><span>模型家族</span><select id="recipe-family"></select><small id="family-workflow-hint" class="hint"></small></label>
        <h3>静态生成参数</h3>
      <div class="size-presets">
        <span>常用画幅</span>
        <button type="button" data-size="832,1216">竖图 832×1216</button>
        <button type="button" data-size="1216,832">横图 1216×832</button>
        <button type="button" data-size="1024,1024">方图 1024×1024</button>
      </div>
      <div class="defaults-grid">
        <label class="field">
          <span>底模</span>
          <select id="def-model"></select>
        </label>
        <label class="field">
          <span>宽</span>
          <input id="def-width" type="number" min="64" step="64" />
        </label>
        <label class="field">
          <span>高</span>
          <input id="def-height" type="number" min="64" step="64" />
        </label>
        <label class="field">
          <span>步数</span>
          <input id="def-steps" type="number" min="1" />
        </label>
        <label class="field">
          <span>CFG</span>
          <input id="def-cfg" type="number" step="0.1" />
        </label>
        <label class="field">
          <span>采样器</span>
          <select id="def-sampler"></select>
        </label>
        <label class="field">
          <span>调度器</span>
          <select id="def-scheduler"></select>
        </label>
        <label class="field">
          <span>降噪</span>
          <input id="def-denoise" type="number" min="0" max="1" step="0.05" />
        </label>
      </div>
      <div class="lora-block">
        <div class="sec-head">
          <span>默认 LoRA</span>
          <button id="btn-add-lora" type="button">添加一条</button>
        </div>
        <div id="lora-list"></div>
        <label class="field">
          <span>LoRA 触发词</span>
          <textarea id="def-trigger-words" rows="2" placeholder="选 LoRA 后自动填入触发词"></textarea>
        </label>
      </div>
      </div>
    </section>

    <aside class="rail" id="rail-right">
      <section>
        <h2>配方试画</h2>
        <textarea id="test-prompt" rows="5" placeholder="1girl, solo, standing, full body, street"></textarea>
        <div class="row-actions">
          <select id="test-size">
            <option value="same">用这套的画幅</option>
            <option value="portrait">竖图</option>
            <option value="landscape">横图</option>
            <option value="square">方图</option>
          </select>
          <button id="btn-run" class="primary" type="button">画一张看看</button>
          <button id="btn-stop" type="button">停</button><button id="btn-resume" type="button" hidden>继续等待</button>
        </div>
        <div id="preview" class="preview empty"></div>
      </section>
      <section>
        <h2>刚才画的</h2>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </aside>
  </main>

  <div id="toast"></div>
  <div id="init-overlay">
    <div id="init-box">
      <div class="spinner-big"></div>
      <div id="init-text">正在打开工作台…</div>
    </div>
  </div>
  <script type="module" src="./app.js?v=comfy-1"></script>
</body>
</html>
